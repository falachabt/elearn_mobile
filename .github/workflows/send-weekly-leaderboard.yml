name: Send Weekly Leaderboard Notification

on:
  # Dimanche 14h heure du Cameroun (UTC+1, pas d'heure d'été) = 13h UTC.
  schedule:
    - cron: '0 13 * * 0'

  workflow_dispatch:

jobs:
  send-weekly-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install @supabase/supabase-js
          npm install expo-server-sdk

      - name: Send weekly leaderboard notification
        run: node scripts/sendWeeklyLeaderboardNotification.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
