name: Send Weekly Leaderboard Notification

on:
  # Doit matcher la frontiere de semaine cote DB (date_trunc('week', now())
  # + interval '6 days 14 hours', calculee en UTC puisque le fuseau de la DB
  # est UTC) = dimanche 14h UTC. Ne PAS aligner sur "14h heure du Cameroun"
  # (13h UTC) -- ca desynchronise la notif de la donnee reellement revelee
  # d'une heure (verifie en direct sur la DB le 2026-09-12).
  schedule:
    - cron: '0 14 * * 0'

  workflow_dispatch:

jobs:
  send-weekly-leaderboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install @supabase/supabase-js
          npm install expo-server-sdk

      - name: Send weekly leaderboard notification
        run: node scripts/sendWeeklyLeaderboardNotification.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
